<!DOCTYPE html>
<html lang="pt-BR">

<body>
<style>
:root{
  --ink:#1B1B1F;
  --ink-soft:#4A4A50;
  --ink-faint:#8A8A90;
  --paper:#FAF9F7;
  --card:#FFFFFF;
  --line:#E7E4DF;
  --orange:#F0631A;
  --orange-dark:#C94E10;
  --orange-tint:#FDE9DD;
  --red:#D64545;
  --red-tint:#FBE7E7;
  --amber:#C98A1A;
  --amber-tint:#FBF0DC;
  --green:#3E8E5A;
  --green-tint:#E4F3EA;
  --radius:14px;
}
*{box-sizing:border-box;}
#bp-app{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  padding:0;
  font-size:14px;
  line-height:1.45;
}
.bp-shell{max-width:1180px;margin:0 auto;padding:20px 20px 60px;position:relative;}
.bp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.bp-title{display:flex;align-items:center;gap:10px;}
.bp-corner{
  width:30px;height:30px;background:var(--orange);
  clip-path:polygon(0 0, 100% 0, 100% 100%);
  border-radius:6px 6px 6px 0;
  flex:none;
}
.bp-title h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-0.01em;}
.bp-title p{margin:0;font-size:12px;color:var(--ink-faint);}
.bp-tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;}
.bp-tab{
  border:none;background:transparent;padding:8px 14px;border-radius:9px;
  font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;
  transition:background .15s, color .15s;
}
.bp-tab.active{background:var(--ink);color:#fff;}
.bp-tab:not(.active):hover{background:var(--orange-tint);color:var(--orange-dark);}
.bp-avatar-btn{
  border:none;background:var(--line);color:var(--ink-soft);cursor:pointer;
  width:30px;height:30px;border-radius:50%;overflow:hidden;padding:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;
}
.bp-avatar-btn img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.bp-avatar-btn:hover{outline:2px solid var(--orange);outline-offset:1px;}
.bp-account-pop{
  position:absolute;top:52px;right:20px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px rgba(27,27,31,.14);
  min-width:220px;z-index:50;
}
.bp-account-email{font-size:12.5px;font-weight:700;color:var(--ink);}
.bp-account-sync{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.bp-backup-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:var(--orange-tint);border:1px solid #F5CDB0;border-radius:11px;padding:8px 14px;margin-bottom:16px;
}
.bp-backup-hint{font-size:11.5px;color:var(--orange-dark);}
.bp-backup-actions{display:flex;gap:8px;flex:none;}
.bp-btn.sm{padding:6px 11px;font-size:12px;background:#fff;}
.bp-tab-reorder{
  border:none;background:transparent;color:var(--ink-faint);cursor:pointer;
  padding:8px 10px;border-radius:9px;font-size:13px;letter-spacing:-1px;
}
.bp-tab-reorder:hover{background:var(--orange-tint);color:var(--orange-dark);}
.bp-reorder-row{
  display:flex;align-items:center;justify-content:space-between;background:var(--paper);
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px;
}
.bp-reorder-row .nm{font-size:13px;font-weight:600;}
.bp-reorder-row .arrows{display:flex;gap:6px;}
.bp-reorder-row .arrows button{
  border:1px solid var(--line);background:#fff;border-radius:7px;width:26px;height:26px;
  cursor:pointer;font-size:12px;color:var(--ink-soft);
}
.bp-reorder-row .arrows button:disabled{opacity:.3;cursor:default;}
.bp-reorder-row .arrows button:not(:disabled):hover{background:var(--orange-tint);color:var(--orange-dark);}
.bp-obs-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;margin-bottom:10px;cursor:pointer;}
.bp-obs-card:hover{border-color:var(--orange);}
.bp-obs-date{font-size:11px;font-weight:700;color:var(--ink-faint);margin-bottom:4px;}
.bp-obs-text{font-size:13px;white-space:pre-wrap;}
.bp-trash-row{
  display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:10px 13px;margin-bottom:7px;
}
.bp-trash-main{flex:1;min-width:0;}
.bp-trash-main .t{font-size:13px;font-weight:600;}
.bp-trash-main .s{font-size:11px;color:var(--ink-faint);}
.bp-trash-actions{display:flex;gap:6px;flex:none;}
.bp-trash-type{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--line);color:var(--ink-soft);flex:none;text-transform:uppercase;}

/* Toolbar */
.bp-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.bp-search{
  flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:13px;background:var(--card);
}
.bp-btn{
  border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;
  background:var(--ink);color:#fff;transition:opacity .15s;
}
.bp-btn:hover{opacity:.85;}
.bp-btn.orange{background:var(--orange);}
.bp-btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}

/* Kanban */
.bp-board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:820px){.bp-board{grid-template-columns:1fr;}}
.bp-col{background:transparent;}
.bp-col-drop{min-height:40px;border-radius:12px;transition:background .12s;}
.bp-col.drag-over .bp-col-drop{background:var(--orange-tint);outline:2px dashed var(--orange);outline-offset:4px;}
.bp-card.dragging{opacity:.4;}
.bp-col-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px;}
.bp-col-head h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:0;font-weight:700;}
.bp-count{background:var(--line);color:var(--ink-soft);font-size:11px;font-weight:700;border-radius:20px;padding:1px 8px;}
.bp-card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 13px 11px;margin-bottom:10px;cursor:grab;overflow:hidden;
  transition:box-shadow .15s, transform .15s;
}
.bp-card:active{cursor:grabbing;}
.bp-card:hover{box-shadow:0 4px 14px rgba(27,27,31,.08);transform:translateY(-1px);}
.bp-card::before{
  content:"";position:absolute;top:0;left:0;width:16px;height:16px;
  background:var(--card-accent,var(--orange));
  clip-path:polygon(0 0,100% 0,0 100%);
}
.bp-card-title{font-size:13.5px;font-weight:700;margin:2px 0 6px;padding-left:2px;}
.bp-card-context{font-size:11.5px;color:var(--ink-faint);margin-bottom:8px;}
.bp-badge{
  display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;
  padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;
}
.bp-badge.atrasado{background:var(--red-tint);color:var(--red);}
.bp-badge.hoje{background:var(--amber-tint);color:var(--amber);}
.bp-badge.prazo{background:var(--green-tint);color:var(--green);}
.bp-badge.sem-data{background:var(--line);color:var(--ink-faint);}
.bp-card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;}
.bp-card-owner{font-size:11px;color:var(--ink-faint);}
.bp-empty{border:1.5px dashed var(--line);border-radius:var(--radius);padding:22px 12px;text-align:center;color:var(--ink-faint);font-size:12.5px;}

/* Leaders */
.bp-leader-grid{display:grid;grid-template-columns:260px 1fr;gap:16px;}
@media (max-width:760px){.bp-leader-grid{grid-template-columns:1fr;}}
.bp-leader-list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px;max-height:70vh;overflow:auto;}
.bp-leader-item{
  display:flex;justify-content:space-between;align-items:center;padding:10px 10px;border-radius:10px;cursor:grab;margin-bottom:2px;
}
.bp-leader-item:active{cursor:grabbing;}
.bp-leader-item.dragging{opacity:.4;}
.bp-leader-item:hover{background:var(--orange-tint);}
.bp-leader-item.active{background:var(--ink);color:#fff;}
.bp-leader-item .nm{font-size:13px;font-weight:600;}
.bp-leader-item .ct{font-size:10.5px;opacity:.6;background:var(--line);border-radius:20px;padding:1px 7px;}
.bp-leader-item.active .ct{background:rgba(255,255,255,.2);color:#fff;}
.bp-area-block{margin-bottom:6px;}
.bp-area-head{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:8px 8px;background:var(--orange-tint);border-radius:9px;margin-bottom:3px;
}
.bp-area-name{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--orange-dark);flex:1;cursor:default;}
.bp-area-name-input{
  flex:1;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--orange-dark);
  background:#fff;border:1px solid var(--orange);border-radius:6px;padding:2px 6px;
}
.bp-area-actions{display:flex;gap:2px;flex:none;}
.bp-area-actions button{
  border:none;background:transparent;color:var(--orange-dark);cursor:pointer;font-size:11px;
  width:20px;height:20px;border-radius:5px;line-height:1;
}
.bp-area-actions button:hover{background:rgba(0,0,0,.08);}
.bp-area-body{padding:2px 2px 4px 6px;border-radius:9px;min-height:10px;transition:background .12s;}
.bp-area-body.drag-over{background:var(--orange-tint);outline:2px dashed var(--orange);outline-offset:2px;}
.bp-area-empty{font-size:11px;color:var(--ink-faint);padding:8px 6px;font-style:italic;}
.bp-leader-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-height:70vh;}
.bp-leader-panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:14px;}
.bp-leader-panel-head h2{margin:0 0 3px;font-size:17px;}
.bp-leader-panel-head .meta{font-size:12px;color:var(--ink-faint);}
.bp-timeline{position:relative;padding-left:18px;}
.bp-timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line);}
.bp-tl-item{position:relative;margin-bottom:16px;}
.bp-tl-item::before{
  content:"›";position:absolute;left:-18px;top:-2px;width:14px;height:14px;
  color:#fff;background:var(--orange);border-radius:50%;font-size:10px;font-weight:900;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.bp-tl-item.done::before{background:var(--green);content:"✓";}
.bp-tl-card{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:11px 13px;}
.bp-tl-context{font-size:13px;margin:0 0 6px;white-space:pre-wrap;}
.bp-tl-next{font-size:12px;color:var(--ink-soft);background:var(--orange-tint);border-radius:8px;padding:7px 10px;white-space:pre-wrap;}
.bp-tl-next b{color:var(--orange-dark);}
.bp-tl-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.bp-tl-actions{display:flex;gap:8px;}
.bp-tl-actions button{background:none;border:none;font-size:11px;color:var(--ink-faint);cursor:pointer;text-decoration:underline;}

/* Agenda */
.bp-agenda-group{margin-bottom:20px;}
.bp-agenda-group h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 8px;}
.bp-agenda-row{
  display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:10px 13px;margin-bottom:7px;cursor:pointer;
}
.bp-agenda-row:hover{border-color:var(--orange);}
.bp-agenda-date{font-size:11px;font-weight:700;color:var(--ink-faint);width:78px;flex:none;}
.bp-agenda-main{flex:1;min-width:0;}
.bp-agenda-main .t{font-size:13px;font-weight:600;}
.bp-agenda-main .s{font-size:11.5px;color:var(--ink-faint);}
.bp-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--line);color:var(--ink-soft);flex:none;}
.bp-tag.tarefa{background:#E4E9F5;color:#31519E;}
.bp-tag.reuniao{background:var(--orange-tint);color:var(--orange-dark);}

/* Modal */
.bp-overlay{position:fixed;inset:0;background:rgba(27,27,31,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
.bp-modal{background:#fff;border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:88vh;overflow:auto;}
.bp-modal h3{margin:0 0 14px;font-size:15px;}
.bp-field{margin-bottom:12px;}
.bp-field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
.bp-field input, .bp-field select, .bp-field textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;background:var(--paper);
}
.bp-field textarea{min-height:70px;resize:vertical;}
.bp-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.bp-modal-actions .danger{color:var(--red);background:none;border:none;font-size:12px;cursor:pointer;margin-right:auto;}
.bp-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bp-note{font-size:11.5px;color:var(--ink-faint);background:var(--orange-tint);border-radius:9px;padding:8px 10px;margin-bottom:14px;}
.bp-loading{padding:60px;text-align:center;color:var(--ink-faint);font-size:13px;}
</style>

const DEFAULT_TAB_ORDER = ['kanban','leaders','agenda','observacoes','lixeira'];
const KANBAN_STATUS_KEYS = ['not_started','in_progress','done'];
const DEFAULT_LABELS = {
  appTitle: 'Agenda BP · nstech',
  appSubtitle: 'Kanban de demandas + acompanhamento de líderes, em um só lugar',
  tabs: { kanban:'Kanban', leaders:'Líderes', agenda:'Agenda', observacoes:'Observações', lixeira:'Lixeira' },
  columns: { not_started:'Não iniciado', in_progress:'Em andamento', done:'Concluído' },
  backupHint: 'Os dados ficam salvos só neste navegador. Exporte um backup em Excel regularmente.',
  exportBtn: '⬇ Exportar backup (.xlsx)',
  importBtn: '⬆ Importar backup'
};
function mergeLabels(saved){
  const l = JSON.parse(JSON.stringify(DEFAULT_LABELS));
  if(!saved || typeof saved !== 'object') return l;
  if(typeof saved.appTitle==='string') l.appTitle = saved.appTitle;
  if(typeof saved.appSubtitle==='string') l.appSubtitle = saved.appSubtitle;
  if(typeof saved.backupHint==='string') l.backupHint = saved.backupHint;
  if(typeof saved.exportBtn==='string') l.exportBtn = saved.exportBtn;
  if(typeof saved.importBtn==='string') l.importBtn = saved.importBtn;
  if(saved.tabs) TAB_KEYS.forEach(k=>{ if(typeof saved.tabs[k]==='string') l.tabs[k]=saved.tabs[k]; });
  if(saved.columns) KANBAN_STATUS_KEYS.forEach(k=>{ if(typeof saved.columns[k]==='string') l.columns[k]=saved.columns[k]; });
  return l;
}
const LEGACY_KANBAN_MAP = {'Não iniciado':'not_started','Em andamento':'in_progress','Concluído':'done'};
function normalizeKanbanValue(v){
  if(KANBAN_STATUS_KEYS.includes(v)) return v;
  if(LEGACY_KANBAN_MAP[v]) return LEGACY_KANBAN_MAP[v];
  return 'not_started';
}
function syncAreasFromLeaders(){
  const known = new Set(state.areas.map(a=>a.name));
  state.leaders.forEach(l=>{
    const name = (l.area||'').trim();
    if(name && !known.has(name)){
      state.areas.push({ id: uid('ar'), name, collapsed:false });
      known.add(name);
    }
  });
}

const nowISODateTime = () => new Date().toISOString();

let storageAvailable = true;
function safeGet(key){
  try{ return localStorage.getItem(key); }catch(e){ storageAvailable = false; return null; }
}
function safeSet(key, val){
  try{ localStorage.setItem(key, val); return true; }catch(e){ storageAvailable = false; return false; }
}

async function loadState(){
  async function getOrSeed(key, seedVal){
    const raw = safeGet(key);
    if(raw){
      try{ return JSON.parse(raw); }catch(e){ /* dado corrompido, cai pro seed */ }
    }
    safeSet(key, JSON.stringify(seedVal));
    return seedVal;
  }
  state.tasks = await getOrSeed('bp_tasks', SEED.tasks);
  state.tasks.forEach(t=>{ t.kanban = normalizeKanbanValue(t.kanban); });
  state.meetings = await getOrSeed('bp_meetings', SEED.meetings);
  state.leaders = await getOrSeed('bp_leaders', SEED.leaders);
  state.leaders.forEach(l=>{ if(typeof l.notes !== 'string') l.notes = ''; });
  state.areas = await getOrSeed('bp_areas', []);
  syncAreasFromLeaders();
  state.observations = await getOrSeed('bp_observations', []);
  state.trash = await getOrSeed('bp_trash', []);
  const cutoff = Date.now() - TRASH_RETENTION_DAYS*24*60*60*1000;
  const before = state.trash.length;
  state.trash = state.trash.filter(x => new Date(x.deletedAt).getTime() >= cutoff);
  if(state.trash.length !== before) await persist('bp_trash');
  const order = await getOrSeed('bp_tab_order', DEFAULT_TAB_ORDER.slice());
  state.tabOrder = order.filter(k=>TAB_KEYS.includes(k));
  TAB_KEYS.forEach(k=>{ if(!state.tabOrder.includes(k)) state.tabOrder.push(k); });
  if(!state.tabOrder.includes(state.tab)) state.tab = state.tabOrder[0];
  const savedLabels = await getOrSeed('bp_labels', null);
  state.labels = mergeLabels(savedLabels);
  state.backupBarCollapsed = safeGet('bp_backup_bar_collapsed') === '1';
  if(state.leaders.length) state.activeLeaderId = state.leaders[0].id;
}
async function persist(key){
  const map = {bp_tasks:state.tasks, bp_meetings:state.meetings, bp_leaders:state.leaders, bp_observations:state.observations, bp_trash:state.trash, bp_tab_order:state.tabOrder, bp_labels:state.labels, bp_areas:state.areas};
  safeSet(key, JSON.stringify(map[key]));
  if(!suppressDrivePush) schedulePush();
}

function moveToTrash(type, payload, label){
  state.trash.push({ id: uid('x'), type, label, deletedAt: nowISODateTime(), payload });
}

function deadlineStatus(deadline){
  if(!deadline) return {cls:'sem-data', label:'Sem data'};
  const d = new Date(deadline+'T00:00:00');
  const t = new Date(todayISO()+'T00:00:00');
  const diff = Math.round((d-t)/86400000);
  if(diff < 0) return {cls:'atrasado', label:'Atrasado'};
  if(diff === 0) return {cls:'hoje', label:'Vence hoje'};
  return {cls:'prazo', label:'No prazo'};
}
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- KANBAN ---------- */
function renderKanban(view){
  view.innerHTML = `
    <div class="bp-toolbar">
      <input class="bp-search" id="bp-k-search" placeholder="Buscar por título, contexto ou responsável…" value="${esc(state.search)}"/>
      <button class="bp-btn orange" id="bp-new-task">+ Nova demanda</button>
    </div>
    <div class="bp-board" id="bp-board"></div>
  `;
  document.getElementById('bp-k-search').addEventListener('input', e=>{state.search=e.target.value; paintBoard();});
  document.getElementById('bp-new-task').addEventListener('click', ()=>openTaskModal(null));
  paintBoard();

  function paintBoard(){
    const cols = [
      {key:'not_started', accent:'var(--ink-faint)'},
      {key:'in_progress', accent:'var(--orange)'},
      {key:'done', accent:'var(--green)'}
    ];
    const q = state.search.trim().toLowerCase();
    const board = document.getElementById('bp-board');
    board.innerHTML = cols.map(col=>{
      let items = state.tasks.filter(t=>t.kanban===col.key);
      if(q) items = items.filter(t => (t.title+' '+t.context+' '+t.owner+' '+t.description).toLowerCase().includes(q));
      items.sort((a,b)=> (a.deadline||'9999').localeCompare(b.deadline||'9999'));
      const cardsHtml = items.length ? items.map(t=>{
        const st = deadlineStatus(t.deadline);
        return `
          <div class="bp-card" style="--card-accent:${col.accent}" data-id="${t.id}" draggable="true">
            <span class="bp-badge ${st.cls}">${st.label}</span>
            <div class="bp-card-title">${esc(t.title)}</div>
            <div class="bp-card-context">${esc(t.context||'Sem contexto')}</div>
            <div class="bp-card-foot">
              <span class="bp-card-owner">${esc(t.owner||'')}</span>
              <span class="bp-card-owner">${fmtDate(t.deadline)}</span>
            </div>
          </div>`;
      }).join('') : `<div class="bp-empty">Nenhuma demanda aqui</div>`;
      return `
        <div class="bp-col" data-status="${col.key}">
          <div class="bp-col-head"><h3>${esc(state.labels.columns[col.key])}</h3><span class="bp-count">${items.length}</span></div>
          <div class="bp-col-drop" data-status="${col.key}">${cardsHtml}</div>
        </div>`;
    }).join('');

    let draggedId = null;
    board.querySelectorAll('.bp-card').forEach(c=>{
      c.addEventListener('click', ()=>{
        const t = state.tasks.find(x=>x.id===c.dataset.id);
        openTaskModal(t);
      });
      c.addEventListener('dragstart', e=>{
        draggedId = c.dataset.id;
        c.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', c.dataset.id);
      });
      c.addEventListener('dragend', ()=>{ c.classList.remove('dragging'); });
    });
    board.querySelectorAll('.bp-col-drop').forEach(zone=>{
      zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.closest('.bp-col').classList.add('drag-over'); });
      zone.addEventListener('dragleave', ()=>{ zone.closest('.bp-col').classList.remove('drag-over'); });
      zone.addEventListener('drop', async e=>{
        e.preventDefault();
        zone.closest('.bp-col').classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain') || draggedId;
        const t = state.tasks.find(x=>x.id===id);
        if(t && t.kanban !== zone.dataset.status){
          t.kanban = zone.dataset.status;
          await persist('bp_tasks');
          paintBoard();
        }
      });
    });
  }
}

function openTaskModal(task){
  const isNew = !task;
  const t = task || {id:uid('t'), owner:'', context:'', title:'', description:'', deadline:'', kanban:'not_started'};
  const overlay = document.createElement('div');
  overlay.className = 'bp-overlay';
  overlay.innerHTML = `
    <div class="bp-modal">
      <h3>${isNew?'Nova demanda':'Editar demanda'}</h3>
      <div class="bp-field"><label>Ação definitiva (título curto)</label><input id="f-title" value="${esc(t.title)}"/></div>
      <div class="bp-field"><label>Contexto / Tag (pessoa ou tema relacionado)</label><input id="f-context" value="${esc(t.context)}"/></div>
      <div class="bp-row2">
        <div class="bp-field"><label>Responsável</label><input id="f-owner" value="${esc(t.owner)}"/></div>
        <div class="bp-field"><label>Prazo</label><input id="f-deadline" type="date" value="${t.deadline||''}"/></div>
      </div>
      <div class="bp-field"><label>Status (Kanban)</label>
        <select id="f-kanban">
          <option value="not_started" ${t.kanban==='not_started'?'selected':''}>${esc(state.labels.columns.not_started)}</option>
          <option value="in_progress" ${t.kanban==='in_progress'?'selected':''}>${esc(state.labels.columns.in_progress)}</option>
          <option value="done" ${t.kanban==='done'?'selected':''}>${esc(state.labels.columns.done)}</option>
        </select>
      </div>
      <div class="bp-field"><label>Descrição completa</label><textarea id="f-desc">${esc(t.description)}</textarea></div>
      <div class="bp-modal-actions">
        ${isNew?'':'<button class="danger" id="f-del">Excluir</button>'}
        <button class="bp-btn ghost" id="f-cancel">Cancelar</button>
        <button class="bp-btn orange" id="f-save">Salvar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) document.body.removeChild(overlay); });
  overlay.querySelector('#f-cancel').addEventListener('click', ()=>document.body.removeChild(overlay));
  if(!isNew) overlay.querySelector('#f-del').addEventListener('click', async ()=>{
    state.tasks = state.tasks.filter(x=>x.id!==t.id);
    moveToTrash('task', t, t.title);
    await persist('bp_tasks');
    await persist('bp_trash');
    document.body.removeChild(overlay); render();
  });
  overlay.querySelector('#f-save').addEventListener('click', async ()=>{
    const upd = {
      id:t.id,
      title: overlay.querySelector('#f-title').value.trim() || 'Sem título',
      context: overlay.querySelector('#f-context').value.trim(),
      owner: overlay.querySelector('#f-owner').value.trim(),
      deadline: overlay.querySelector('#f-deadline').value,
      kanban: overlay.querySelector('#f-kanban').value,
      description: overlay.querySelector('#f-desc').value.trim()
    };
    const idx = state.tasks.findIndex(x=>x.id===t.id);
    if(idx>=0) state.tasks[idx]=upd; else state.tasks.push(upd);
    await persist('bp_tasks');
    document.body.removeChild(overlay); render();
  });
}

      input.value = area.name;
      input.className = 'bp-area-name-input';
      nameSpan.replaceWith(input);
      input.focus();
      input.select();
      const commit = async ()=>{
        const newName = input.value.trim() || area.name;
        if(newName !== area.name){
          const oldName = area.name;
          state.leaders.forEach(l=>{ if((l.area||'').trim()===oldName) l.area = newName; });
          area.name = newName;
          await persist('bp_leaders');
          await persist('bp_areas');
        }
        paintList(q);
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', ev=>{ if(ev.key==='Enter'){ input.blur(); } if(ev.key==='Escape'){ input.value=area.name; input.blur(); } });
    }));

    // ocultar/mostrar líderes da área
    list.querySelectorAll('[data-toggle-area]').forEach(btn=>btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const area = state.areas.find(a=>a.id===btn.dataset.toggleArea);
      if(!area) return;
      area.collapsed = !area.collapsed;
      await persist('bp_areas');
      paintList(q);
    }));

    // remover área (líderes vão para "Sem área")
    list.querySelectorAll('[data-del-area]').forEach(btn=>btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const area = state.areas.find(a=>a.id===btn.dataset.delArea);
      if(!area) return;
      if(!confirm(`Remover a área "${area.name}"? Os líderes dela ficam em "Sem área", nada é excluído.`)) return;
      state.leaders.forEach(l=>{ if((l.area||'').trim()===area.name) l.area=''; });
      state.areas = state.areas.filter(a=>a.id!==area.id);
      await persist('bp_leaders');
      await persist('bp_areas');
      paintList(q);
    }));

    // drag and drop de líderes entre áreas
    let draggedLeaderId = null;
    list.querySelectorAll('.bp-leader-item').forEach(it=>{
      it.addEventListener('dragstart', e=>{
        draggedLeaderId = it.dataset.id;
        it.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', it.dataset.id);
      });
      it.addEventListener('dragend', ()=> it.classList.remove('dragging'));
    });
    list.querySelectorAll('[data-drop-area]').forEach(zone=>{
      zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', ()=> zone.classList.remove('drag-over'));
      zone.addEventListener('drop', async e=>{
        e.preventDefault();
        zone.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain') || draggedLeaderId;
        const leader = state.leaders.find(l=>l.id===id);
        if(leader){
          leader.area = zone.dataset.dropArea || '';
          await persist('bp_leaders');
          paintList(q);
        }
      });
    });
  }

  function paintPanel(){
    const panel = document.getElementById('bp-leader-panel');
    const leader = state.leaders.find(l=>l.id===state.activeLeaderId);
    if(!leader){ panel.innerHTML = `<div class="bp-empty">Selecione um líder</div>`; return; }
    const meetings = state.meetings.filter(m=>m.leader===leader.name)
      .slice().reverse();
    const pending = state.tasks.filter(t=> t.kanban!=='done' && (t.context===leader.name || t.owner===leader.name));
    panel.innerHTML = `
      <div class="bp-leader-panel-head">
        <div>
          <h2>${esc(leader.name)}</h2>
          <div class="meta">${esc(leader.area||'Área não definida')} · Cadência: ${esc(leader.cadence||'—')}</div>
        </div>
        <button class="bp-btn ghost" id="bp-edit-leader">Editar</button>
      </div>
      ${leader.notes? `<div class="bp-tl-next" style="margin-bottom:16px;white-space:pre-wrap;"><b>Observações:</b> ${esc(leader.notes)}</div>`:''}
      ${pending.length? `<div style="margin-bottom:16px;"><div style="font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;">Pendências abertas (${pending.length})</div>
        ${pending.map(t=>{const st=deadlineStatus(t.deadline); return `<div class="bp-agenda-row" data-task="${t.id}"><span class="bp-badge ${st.cls}">${st.label}</span><div class="bp-agenda-main"><div class="t">${esc(t.title)}</div></div></div>`;}).join('')}
      </div>`:''}
      <div style="font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px;">Histórico de 1:1s</div>
      <div class="bp-timeline">
        ${meetings.length ? meetings.map(m=>`
          <div class="bp-tl-item ${m.done?'done':''}">
            <div class="bp-tl-card">
              <p class="bp-tl-context">${esc(m.context)}</p>
              ${m.nextSteps? `<div class="bp-tl-next"><b>Próximos passos:</b> ${esc(m.nextSteps)}</div>`:''}
              <div class="bp-tl-foot">
                <span class="bp-badge ${m.done?'prazo':'hoje'}">${m.done?'Concluído':'Em aberto'}</span>
                <div class="bp-tl-actions"><button data-edit="${m.id}">editar</button><button data-del="${m.id}">excluir</button></div>
              </div>
            </div>
          </div>`).join('') : '<div class="bp-empty">Nenhuma reunião registrada ainda</div>'}
      </div>
    `;
    panel.querySelector('#bp-edit-leader').addEventListener('click', ()=>openLeaderModal(leader));
    panel.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{
      const m = state.meetings.find(x=>x.id===b.dataset.edit);
      openMeetingModal(m, leader.id);
    }));
    panel.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
      const m = state.meetings.find(x=>x.id===b.dataset.del);
      state.meetings = state.meetings.filter(x=>x.id!==b.dataset.del);
      if(m) moveToTrash('meeting', m, `1:1 · ${m.leader}`);
      await persist('bp_meetings'); await persist('bp_trash'); render();
    }));
    panel.querySelectorAll('[data-task]').forEach(row=>row.addEventListener('click', ()=>{
      const t = state.tasks.find(x=>x.id===row.dataset.task);
      openTaskModal(t);
    }));
  }
}

/* ---------- AGENDA ---------- */
function renderAgenda(view){
  const today = todayISO();
  const items = [];
  state.tasks.filter(t=>t.kanban!=='done' && t.deadline).forEach(t=>{
    items.push({date:t.deadline, type:'tarefa', title:t.title, sub:t.context, ref:t});
  });
  items.sort((a,b)=>a.date.localeCompare(b.date));
  const atrasado = items.filter(i=>i.date<today);
  const hoje = items.filter(i=>i.date===today);
  const proximos = items.filter(i=>i.date>today);

  function group(title, arr){
    if(!arr.length) return '';
    return `<div class="bp-agenda-group"><h3>${title} (${arr.length})</h3>
      ${arr.map(i=>`
        <div class="bp-agenda-row" data-type="${i.type}" data-id="${i.ref.id}">
          <span class="bp-agenda-date">${fmtDate(i.date)}</span>
          <div class="bp-agenda-main"><div class="t">${esc(i.title)}</div><div class="s">${esc(i.sub||'')}</div></div>
          <span class="bp-tag ${i.type}">${i.type==='tarefa'?'Tarefa':'1:1'}</span>
        </div>`).join('')}
    </div>`;
  }

  view.innerHTML = `
    <div class="bp-toolbar">
      <div style="flex:1;font-size:12.5px;color:var(--ink-faint);">Demandas com prazo, direto do Kanban — o que você criar aqui aparece lá, e vice-versa.</div>
      <button class="bp-btn orange" id="bp-agenda-new-task">+ Nova demanda</button>
    </div>
    ${group('Atrasado', atrasado)}
    ${group('Hoje', hoje)}
    ${group('Próximos', proximos)}
    ${!items.length? '<div class="bp-empty">Nada agendado</div>':''}
  `;
  view.querySelector('#bp-agenda-new-task').addEventListener('click', ()=>openTaskModal(null));
  view.querySelectorAll('.bp-agenda-row').forEach(row=>row.addEventListener('click', ()=>{
    openTaskModal(state.tasks.find(t=>t.id===row.dataset.id));
  }));
}

/* ---------- LIXEIRA ---------- */
const TRASH_TYPE_LABEL = {task:'Demanda', meeting:'1:1', leader:'Líder', observation:'Observação'};
const TRASH_TARGET_ARRAY = {task:'tasks', meeting:'meetings', leader:'leaders', observation:'observations'};
const TRASH_TARGET_KEY = {task:'bp_tasks', meeting:'bp_meetings', leader:'bp_leaders', observation:'bp_observations'};

function daysLeft(deletedAt){
  const elapsed = (Date.now() - new Date(deletedAt).getTime())/(24*60*60*1000);
  return Math.max(0, Math.ceil(TRASH_RETENTION_DAYS - elapsed));
}

  view.innerHTML = `
    <div class="bp-toolbar">
      <div style="flex:1;font-size:12.5px;color:var(--ink-faint);">Itens excluídos ficam aqui por ${TRASH_RETENTION_DAYS} dias antes de serem removidos automaticamente.</div>
      ${items.length? '<button class="bp-btn ghost" id="bp-empty-trash">Esvaziar lixeira</button>':''}
    </div>
    <div id="bp-trash-list">
      ${items.length ? items.map(x=>`
        <div class="bp-trash-row" data-id="${x.id}">
          <span class="bp-trash-type">${TRASH_TYPE_LABEL[x.type]||x.type}</span>
          <div class="bp-trash-main">
            <div class="t">${esc(x.label||'(sem título)')}</div>
            <div class="s">Excluído em ${fmtDate(x.deletedAt.slice(0,10))} · some em ${daysLeft(x.deletedAt)} dia(s)</div>
          </div>
          <div class="bp-trash-actions">
            <button class="bp-btn ghost sm" data-restore="${x.id}">Restaurar</button>
            <button class="bp-btn ghost sm" data-purge="${x.id}" style="color:var(--red);">Excluir definitivo</button>
          </div>
        </div>`).join('') : '<div class="bp-empty">Lixeira vazia</div>'}
    </div>
  `;
  view.querySelectorAll('[data-restore]').forEach(b=>b.addEventListener('click', async ()=>{
    const entry = state.trash.find(x=>x.id===b.dataset.restore);
    if(!entry) return;
    const arrKey = TRASH_TARGET_ARRAY[entry.type];
    state[arrKey].push(entry.payload);
    state.trash = state.trash.filter(x=>x.id!==entry.id);
    await persist(TRASH_TARGET_KEY[entry.type]);
    await persist('bp_trash');
    render();
  }));
  view.querySelectorAll('[data-purge]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Excluir definitivamente? Não será possível recuperar este item depois.')) return;
    state.trash = state.trash.filter(x=>x.id!==b.dataset.purge);
    await persist('bp_trash');
    render();
  }));
  const emptyBtn = view.querySelector('#bp-empty-trash');
  if(emptyBtn) emptyBtn.addEventListener('click', async ()=>{
    if(!confirm(`Excluir definitivamente todos os ${items.length} itens da lixeira?`)) return;
    state.trash = [];
    await persist('bp_trash');
    render();
  });
}

/* ---------- BACKUP (exportar / importar em Excel) ---------- */
const TASK_FIELDS = ['id','title','context','owner','deadline','kanban','description'];
const MEETING_FIELDS = ['id','leader','date','context','nextSteps','done'];
const LEADER_FIELDS = ['id','name','area','cadence','notes'];
const OBS_FIELDS = ['id','date','title','text'];
const TRASH_FIELDS = ['id','type','label','deletedAt','payload_json'];

function normalizeRows(arr, fields){
  return (arr||[]).map(o=>{
    const row={};
    fields.forEach(f=>{ row[f] = (o[f]===undefined||o[f]===null) ? '' : o[f]; });
    return row;
  });
}

function exportBackup(){
  if(typeof XLSX === 'undefined'){
    alert('Não foi possível carregar o gerador de Excel (verifique sua conexão). Vou exportar em JSON como alternativa.');
    exportBackupJSON();
    return;
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(normalizeRows(state.tasks, TASK_FIELDS)), 'Tarefas');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(normalizeRows(state.meetings, MEETING_FIELDS)), 'Reunioes');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(normalizeRows(state.leaders, LEADER_FIELDS)), 'Lideres');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(normalizeRows(state.observations, OBS_FIELDS)), 'Observacoes');
  const trashRows = (state.trash||[]).map(x=>({id:x.id, type:x.type, label:x.label||'', deletedAt:x.deletedAt, payload_json: JSON.stringify(x.payload)}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(normalizeRows(trashRows, TRASH_FIELDS)), 'Lixeira');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{exportedAt:new Date().toISOString(), tabOrder: state.tabOrder.join(',')}]), 'Meta');
  XLSX.writeFile(wb, `agenda_bp_backup_${todayISO()}.xlsx`);
  registerExportTimestamp();
}

function registerExportTimestamp(){
  safeSet('bp_last_export', new Date().toISOString());
  const el = document.getElementById('bp-last-export');
  if(el) el.textContent = lastExportLabel();
}

function lastExportLabel(){
  const raw = safeGet('bp_last_export');
  if(!raw) return 'Nenhum backup exportado ainda — exporte antes de trocar de computador ou navegador.';
  const d = new Date(raw);
  return `Último backup exportado em ${d.toLocaleDateString('pt-BR')} às ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}.`;
}

function exportBackupJSON(){
  const payload = {
    _tipo: 'agenda_bp_backup', _versao: 1, exportedAt: new Date().toISOString(),
    tasks: state.tasks, meetings: state.meetings, leaders: state.leaders,
    observations: state.observations, trash: state.trash, tabOrder: state.tabOrder
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `agenda_bp_backup_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  registerExportTimestamp();
}

function coerceBool(v){ return v===true || v==='TRUE' || v==='true' || v===1 || v==='1'; }

async function applyImportedState(parsed){
  const counts = `${parsed.tasks.length} demandas\n${(parsed.meetings||[]).length} registros de 1:1\n${(parsed.leaders||[]).length} líderes\n${(parsed.observations||[]).length} observações\n${(parsed.trash||[]).length} itens na lixeira`;
  const when = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString('pt-BR') : 'data desconhecida';
  if(!confirm(`Isto vai substituir todos os dados atuais deste navegador por:\n\n${counts}\n\nBackup de: ${when}\n\nContinuar?`)) return false;

  state.tasks = parsed.tasks;
  state.tasks.forEach(t=>{ t.kanban = normalizeKanbanValue(t.kanban); });
  state.meetings = parsed.meetings || [];
  state.leaders = parsed.leaders || [];
  state.leaders.forEach(l=>{ if(typeof l.notes !== 'string') l.notes = ''; });
  state.observations = parsed.observations || [];
  state.trash = parsed.trash || [];
  state.areas = Array.isArray(parsed.areas) ? parsed.areas : state.areas;
  syncAreasFromLeaders();
  if(Array.isArray(parsed.tabOrder) && parsed.tabOrder.length){
    state.tabOrder = parsed.tabOrder.filter(k=>TAB_KEYS.includes(k));
    TAB_KEYS.forEach(k=>{ if(!state.tabOrder.includes(k)) state.tabOrder.push(k); });
  }
  await persist('bp_tasks'); await persist('bp_meetings'); await persist('bp_leaders');
  await persist('bp_observations'); await persist('bp_trash'); await persist('bp_tab_order'); await persist('bp_areas');
  state.activeLeaderId = state.leaders.length ? state.leaders[0].id : null;
  if(!state.tabOrder.includes(state.tab)) state.tab = state.tabOrder[0];
  render();
  alert('Backup importado com sucesso.');
  return true;
}

function importFromExcel(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, {type:'array'});
  if(!wb.Sheets['Tarefas']){
    alert('Arquivo não parece ser um backup exportado por esta ferramenta (aba "Tarefas" não encontrada).');
    return;
  }
  const sheet = (name)=> wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:''}) : [];
  const tasks = sheet('Tarefas').map(r=>({id:String(r.id||uid('t')), title:String(r.title||''), context:String(r.context||''), owner:String(r.owner||''), deadline: r.deadline?String(r.deadline):'', kanban:String(r.kanban||'Não iniciado'), description:String(r.description||'')}));
  const meetings = sheet('Reunioes').map(r=>({id:String(r.id||uid('m')), leader:String(r.leader||''), date:String(r.date||todayISO()), context:String(r.context||''), nextSteps:String(r.nextSteps||''), done:coerceBool(r.done)}));
  const leaders = sheet('Lideres').map(r=>({id:String(r.id||uid('l')), name:String(r.name||''), area:String(r.area||''), cadence:String(r.cadence||'Mensal'), notes:String(r.notes||'')}));
  const observations = sheet('Observacoes').map(r=>({id:String(r.id||uid('o')), date:String(r.date||todayISO()), title:String(r.title||''), text:String(r.text||'')}));
  const trash = sheet('Lixeira').map(r=>{
    let payload = {};
    try{ payload = JSON.parse(r.payload_json||'{}'); }catch(e){ payload = {}; }
    return {id:String(r.id||uid('x')), type:String(r.type||''), label:String(r.label||''), deletedAt:String(r.deletedAt||nowISODateTime()), payload};
  });
  const meta = sheet('Meta')[0] || {};
  applyImportedState({tasks, meetings, leaders, observations, trash, tabOrder: meta.tabOrder ? String(meta.tabOrder).split(',') : null, exportedAt: meta.exportedAt});
}

function importBackupFile(file){
  const isJSON = file.name.toLowerCase().endsWith('.json');
  if(isJSON){
    const reader = new FileReader();
    reader.onload = (e)=>{
      let data;
      try{ data = JSON.parse(e.target.result); }
      catch(err){ alert('Não foi possível ler o arquivo JSON.'); return; }
      if(!data || !Array.isArray(data.tasks)){ alert('Arquivo em formato inesperado.'); return; }
      applyImportedState(data);
    };
    reader.readAsText(file, 'utf-8');
  } else {
    if(typeof XLSX === 'undefined'){
      alert('Não foi possível carregar o leitor de Excel (verifique sua conexão com a internet).');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e)=> importFromExcel(new Uint8Array(e.target.result));
    reader.readAsArrayBuffer(file);
  }
}

/* ---------- GOOGLE LOGIN + SINCRONIZAÇÃO COM DRIVE ---------- */
function initGoogleAuth(){
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){
    console.warn('Google Identity Services não carregou.');
    return;
  }
  driveAuth.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPES,
    callback: () => {}
  });
}

function scheduleTokenRenewal(){
  clearTimeout(tokenRenewTimer);
  // Renova 5 minutos antes do token expirar, silenciosamente, sem pedir nada ao usuário.
  const msUntilRenew = Math.max(driveAuth.expiresAt - Date.now() - 5*60*1000, 15000);
  tokenRenewTimer = setTimeout(async ()=>{
    try{
      await requestAccessToken(false);
      // sucesso: scheduleTokenRenewal já foi re-agendado dentro do requestAccessToken
    }catch(e){
      console.warn('Não foi possível renovar a sessão do Google automaticamente.', e);
      driveAuth.connected = false;
      render();
    }
  }, msUntilRenew);
}

function requestAccessToken(interactive){
  return new Promise((resolve, reject)=>{
    if(!driveAuth.tokenClient){ reject(new Error('Login do Google indisponível.')); return; }
    driveAuth.tokenClient.callback = (resp)=>{
      if(resp.error){ reject(resp); return; }
      driveAuth.token = resp.access_token;
      driveAuth.expiresAt = Date.now() + (Number(resp.expires_in||3600) * 1000);
      scheduleTokenRenewal();
      resolve(resp.access_token);
    };
    driveAuth.tokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' });
  });
}

async function driveApiFetch(url, options){
  options = options || {};
  const headers = Object.assign({}, options.headers||{}, { 'Authorization': 'Bearer ' + driveAuth.token });
  const res = await fetch(url, Object.assign({}, options, { headers }));
  if(res.status === 401){
    driveAuth.token = null; driveAuth.connected = false;
    throw new Error('Sessão do Google expirou. Faça login novamente.');
  }
  if(!res.ok){
    const text = await res.text().catch(()=>'');
    throw new Error('Erro na API do Drive ('+res.status+'): '+text);
  }
  return res;
}

async function fetchUserInfo(){
  const res = await driveApiFetch('https://www.googleapis.com/oauth2/v3/userinfo');
  const data = await res.json();
  driveAuth.email = data.email || null;
  driveAuth.picture = data.picture || null;
}

async function driveFindFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await driveApiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`);
  const data = await res.json();
  return (data.files && data.files[0]) || null;
}

async function driveReadFile(fileId){
  const res = await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  const text = await res.text();
  try{ return JSON.parse(text); }catch(e){ return null; }
}

async function driveCreateFile(payload){
  const boundary = 'bpboundary' + Date.now();
  const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n` +
    `--${boundary}--`;
  const res = await driveApiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
    body
  });
  return res.json();
}

async function driveUpdateFile(fileId, payload){
  const res = await driveApiFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  return res.json();
}

function buildSyncPayload(){
  return {
    _tipo: 'agenda_bp_drive_sync', _versao: 1, syncedAt: new Date().toISOString(),
    tasks: state.tasks, meetings: state.meetings, leaders: state.leaders,
    observations: state.observations, trash: state.trash, tabOrder: state.tabOrder, labels: state.labels, areas: state.areas
  };
}

async function applyDriveState(remote){
  if(!remote || !Array.isArray(remote.tasks)) return;
  suppressDrivePush = true;
  state.tasks = remote.tasks;
  state.tasks.forEach(t=>{ t.kanban = normalizeKanbanValue(t.kanban); });
  state.meetings = remote.meetings || [];
  state.leaders = remote.leaders || [];
  state.leaders.forEach(l=>{ if(typeof l.notes !== 'string') l.notes = ''; });
  state.observations = remote.observations || [];
  state.trash = remote.trash || [];
  state.areas = Array.isArray(remote.areas) ? remote.areas : [];
  syncAreasFromLeaders();
  if(Array.isArray(remote.tabOrder) && remote.tabOrder.length){
    state.tabOrder = remote.tabOrder.filter(k=>TAB_KEYS.includes(k));
    TAB_KEYS.forEach(k=>{ if(!state.tabOrder.includes(k)) state.tabOrder.push(k); });
  }
  if(remote.labels) state.labels = mergeLabels(remote.labels);
  await persist('bp_tasks'); await persist('bp_meetings'); await persist('bp_leaders');
  await persist('bp_observations'); await persist('bp_trash'); await persist('bp_tab_order'); await persist('bp_labels'); await persist('bp_areas');
  state.activeLeaderId = state.leaders.length ? state.leaders[0].id : null;
  if(!state.tabOrder.includes(state.tab)) state.tab = state.tabOrder[0];
  suppressDrivePush = false;
}

async function driveInitialSync(){
  const file = await driveFindFile();
  if(file){
    driveAuth.fileId = file.id;
    const remote = await driveReadFile(file.id);
    await applyDriveState(remote);
  } else {
    const created = await driveCreateFile(buildSyncPayload());
    driveAuth.fileId = created.id;
  }
  driveAuth.lastSyncAt = new Date().toISOString();
}

function schedulePush(){
  if(!driveAuth.token || !driveAuth.fileId) return;
  clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(pushToDrive, 900);
}

async function pushToDrive(){
  if(!driveAuth.token || !driveAuth.fileId) return;
  driveAuth.syncing = true;
  updateSyncBadge();
  try{
    await driveUpdateFile(driveAuth.fileId, buildSyncPayload());
    driveAuth.lastSyncAt = new Date().toISOString();
  }catch(e){
    console.error('Falha ao sincronizar com o Drive', e);
    if(!driveAuth.token){
      // Sessão expirou no meio do caminho: tenta renovar sozinho uma vez antes de desistir.
      try{
        await requestAccessToken(false);
        await driveUpdateFile(driveAuth.fileId, buildSyncPayload());
        driveAuth.lastSyncAt = new Date().toISOString();
      }catch(e2){
        driveAuth.connected = false;
        render();
      }
    }
  } finally {
    driveAuth.syncing = false;
    updateSyncBadge();
  }
}

function updateSyncBadge(){
  const el = document.getElementById('bp-drive-status');
  if(el) el.textContent = driveStatusLabel();
}

function driveStatusLabel(){
  if(!driveAuth.connected) return 'Não conectado — dados salvos só neste navegador.';
  if(driveAuth.syncing) return `Conectado como ${driveAuth.email} · sincronizando…`;
  if(driveAuth.lastSyncAt){
    const d = new Date(driveAuth.lastSyncAt);
    return `Conectado como ${driveAuth.email} · sincronizado às ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  }
  return `Conectado como ${driveAuth.email}`;
}

async function attemptSilentLogin(){
  try{
    await requestAccessToken(false);
    await fetchUserInfo();
    driveAuth.connected = true;
    render();
    await driveInitialSync();
    updateSyncBadge();
  }catch(e){
    // Falha silenciosa é esperada (ex: primeira vez, ou sessão Google expirada). Não mostra erro.
    driveAuth.connected = false;
  }
}

async function handleGoogleLogin(){
  const btn = document.getElementById('bp-google-login');
  if(btn){ btn.disabled = true; btn.textContent = 'Conectando…'; }
  try{
    await requestAccessToken(true);
    await fetchUserInfo();
    driveAuth.connected = true;
    render();
    await driveInitialSync();
    updateSyncBadge();
  }catch(e){
    console.error(e);
    driveAuth.connected = false;
    const detail = (e && (e.message || e.error || e.details)) || JSON.stringify(e);
    alert('Não foi possível conectar ao Google.\n\nDetalhe técnico (copie isso pra mim):\n' + detail);
    render();
  }
}

function handleGoogleLogout(){
  clearTimeout(tokenRenewTimer);
  if(driveAuth.token && typeof google !== 'undefined' && google.accounts && google.accounts.oauth2){
    try{ google.accounts.oauth2.revoke(driveAuth.token, ()=>{}); }catch(e){}
  }
  driveAuth = { token: null, expiresAt: 0, fileId: null, email: null, picture: null, syncing: false, lastSyncAt: null, connected: false, tokenClient: driveAuth.tokenClient };
  render();
}

/* ---------- INIT ---------- */
initGoogleAuth();
loadState().then(render).then(()=>{ attemptSilentLogin(); });
})();
</script>
